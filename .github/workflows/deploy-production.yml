name: Manual deploy production

on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/toptuk/boardly-backend
  FRONTEND_IMAGE: ghcr.io/toptuk/boardly-frontend

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret
      DEV_FAKE_AUTH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend-build:
    name: Frontend build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  build:
    name: Build and push images
    needs: [tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_KEY_PATH: /tmp/ssh_key
      ENV_FILE_PATH: /tmp/production.env
      SSH_PORT: 45654
      DEPLOY_PATH: boardly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_SSH_USERNAME }}" ]; then
            echo "::error::PRODUCTION_SSH_USERNAME secret is not set or empty (this causes 'runner@host' and Permission denied)"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_HOST }}" ]; then
            echo "::error::PRODUCTION_SSH_HOST secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "::error::PRODUCTION_SSH_KEY secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.TOKEN }}" ]; then
            echo "::error::TOKEN secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            echo "::error::POSTGRES_PASSWORD secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::JWT_SECRET secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "::error::BOT_TOKEN secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.BOT_USERNAME }}" ]; then
            echo "::error::BOT_USERNAME secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::error::APP_URL secret is not set or empty"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" | sed 's/\r$//' > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          head -n1 ${{ env.SSH_KEY_PATH }} | grep -q "BEGIN.*KEY" || (echo "Invalid key format" && exit 1)

      - name: Generate production .env
        run: |
          {
            echo "POSTGRES_USER=boardly"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=boardly"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}"
            echo "BOT_USERNAME=${{ secrets.BOT_USERNAME }}"
            echo "APP_URL=${{ secrets.APP_URL }}"
            echo "REMINDERS_ENABLED=1"
            echo "REMINDERS_DAILY_TIME=09:00"
            echo "REMINDERS_DEADLINE_DAYS=2"
            echo "REMINDERS_CHECK_INTERVAL_MIN=30"
            echo "REMINDERS_TIMEZONE=UTC"
          } > ${{ env.ENV_FILE_PATH }}
          chmod 600 ${{ env.ENV_FILE_PATH }}

      - name: Copy compose and .env to server
        run: |
          ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}"
          scp -P ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            docker-compose.production.yml ${{ env.ENV_FILE_PATH }} \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy on PROD server
        run: |
          ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ${{ env.SSH_KEY_PATH }} \
            ${{ secrets.PRODUCTION_SSH_USERNAME }}@${{ secrets.PRODUCTION_SSH_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             mv production.env .env && \
             chmod 600 .env && \
             docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.TOKEN }} && \
             docker pull ${{ env.BACKEND_IMAGE }}:latest && \
             docker tag ${{ env.BACKEND_IMAGE }}:latest boardly-backend:latest && \
             docker pull ${{ env.FRONTEND_IMAGE }}:latest && \
             docker tag ${{ env.FRONTEND_IMAGE }}:latest boardly-frontend:latest && \
             docker compose -f docker-compose.production.yml down --remove-orphans && \
             docker compose -f docker-compose.production.yml up -d --no-build --force-recreate && \
             docker image prune -af"

      - name: Clean up local secrets
        if: always()
        run: rm -f ${{ env.SSH_KEY_PATH }} ${{ env.ENV_FILE_PATH }}
