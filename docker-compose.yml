# Local stack. Publishes the site on APP_PORT.
# On the shared VPS use docker-compose.production.yml instead.

name: boardly

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly
      POSTGRES_DB: boardly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardly -d boardly"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://boardly:boardly@db:5432/boardly
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DEV_FAKE_AUTH: ${DEV_FAKE_AUTH:-1}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-1}
      REMINDERS_DAILY_TIME: ${REMINDERS_DAILY_TIME:-09:00}
      REMINDERS_DEADLINE_DAYS: ${REMINDERS_DEADLINE_DAYS:-2}
      REMINDERS_CHECK_INTERVAL_MIN: ${REMINDERS_CHECK_INTERVAL_MIN:-30}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-UTC}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
