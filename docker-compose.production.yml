# Production stack for the shared VPS (same reverse proxy as KanGame).
# The proxy container is already attached to the external network pmi_network
# and routes by VIRTUAL_HOST / VIRTUAL_PORT. This file publishes no host ports,
# so it does not collide with other sites on the machine.
#
#   docker compose -f docker-compose.production.yml up -d --build
#
# TLS is terminated by that proxy. Place a certificate at
# /etc/nginx/certs/${VIRTUAL_HOST}.crt and .key — nginx-proxy loads a cert
# whose filename matches VIRTUAL_HOST. Do not also set ssl_certificate in
# vhost.d for that same path (the directive would be duplicated).
#
# WebSocket board sync needs the snippet in deploy/vhost.d/ copied to the
# proxy's /etc/nginx/vhost.d/ (same layout as KanGame's deploy/vhost.d).

name: boardly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly
      POSTGRES_DB: boardly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardly -d boardly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://boardly:boardly@db:5432/boardly
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:?set BOT_USERNAME}
      APP_URL: ${APP_URL:?set APP_URL}
      DEV_FAKE_AUTH: "0"
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-1}
      REMINDERS_DAILY_TIME: ${REMINDERS_DAILY_TIME:-09:00}
      REMINDERS_DEADLINE_DAYS: ${REMINDERS_DEADLINE_DAYS:-2}
      REMINDERS_CHECK_INTERVAL_MIN: ${REMINDERS_CHECK_INTERVAL_MIN:-30}
      REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-UTC}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST}
      VIRTUAL_PORT: "80"
      # VIRTUAL_PROTO: "https"
    depends_on:
      - backend
    networks:
      - default
      - pmi_network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  pmi_network:
    external: true
